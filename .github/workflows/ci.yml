name: CI - Contract Validation & Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  contract-validation:
    name: Validate API Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # fetch full history to compare against frozen contract

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install openapi-diff
        run: pip install openapi-diff

      - name: Start services for current OpenAPI generation
        run: |
          docker-compose up -d db redis
          sleep 10  # wait for healthchecks

      - name: Generate current OpenAPI spec
        run: |
          cd backend
          pip install poetry
          poetry install --no-interaction
          poetry run python -c "
          from app.main import app
          import json
          with open('../contracts/openapi-current.json', 'w') as f:
              json.dump(app.openapi(), f, indent=2)
          "

      - name: Compare against frozen contract
        id: contract_diff
        run: |
          if [ ! -f contracts/openapi-frozen.json ]; then
            echo "::warning::No frozen contract found. First run — will freeze current spec."
            cp contracts/openapi-current.json contracts/openapi-frozen.json
            exit 0
          fi

          # Run diff and capture output
          openapi-diff contracts/openapi-frozen.json contracts/openapi-current.json > contract-diff.txt || true

          # Check for breaking changes (removed paths, removed fields, type changes)
          if grep -E "(removed|incompatible|breaking)" contract-diff.txt; then
            echo "::error::Breaking API contract change detected. See contract-diff.txt artifact."
            cat contract-diff.txt
            exit 1
          else
            echo "::notice::API contract validated — no breaking changes."
            cat contract-diff.txt
          fi

      - name: Upload diff artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: contract-diff
          path: contract-diff.txt

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: cpi_user
          POSTGRES_PASSWORD: cpi_pass
          POSTGRES_DB: cpi_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install poetry
          poetry install --no-interaction

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL_SYNC: postgresql://cpi_user:cpi_pass@localhost:5432/cpi_test
        run: poetry run alembic upgrade head

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://cpi_user:cpi_pass@localhost:5432/cpi_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test_secret_at_least_32_characters_long
          JWT_REFRESH_SECRET: test_refresh_secret_at_least_32_chars
        run: poetry run pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: backend/coverage.xml
          flags: backend

  integration-tests:
    name: Integration Tests (7 scenarios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start full stack
        run: docker-compose up -d --build

      - name: Wait for services
        run: |
          timeout 120 bash -c 'until curl -f http://localhost:8000/ready; do sleep 2; done'

      - name: Run integration test suite
        run: |
          docker-compose exec -T backend pytest tests/integration/ -v --tb=short

      - name: Collect logs on failure
        if: failure()
        run: |
          docker-compose logs backend > integration-failure-backend.log
          docker-compose logs db > integration-failure-db.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: integration-failure-logs
          path: integration-failure-*.log

      - name: Tear down
        if: always()
        run: docker-compose down -v

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Lint backend
        working-directory: backend
        run: ruff check app/ tests/

  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
