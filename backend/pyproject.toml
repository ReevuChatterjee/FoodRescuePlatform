[tool.poetry]
name = "cpi-backend"
version = "0.1.0"
description = "Algorithmic Micro-Donation & Food-Waste Routing Service — Backend"
authors = ["CPI Team"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
sqlalchemy = { version = "^2.0.30", extras = ["asyncio"] }
asyncpg = "^0.29.0"
aiosqlite = "^0.20.0"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"        # alembic offline / sync admin tasks only
python-jose = { version = "^3.3.0", extras = ["cryptography"] }
passlib = { version = "^1.7.4", extras = ["bcrypt"] }
bcrypt = "<4.1"                   # passlib 1.7.4 predates bcrypt's 4.1 __about__ removal — pin or hashing breaks
argon2-cffi = "^23.1.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
python-dotenv = "^1.0.1"
redis = { version = "^5.0.4", extras = ["hiredis"] }
celery = "^5.4.0"
httpx = "^0.27.0"                 # integration test client
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.7"
pytest-cov = "^5.0.0"
anyio = "^4.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
