version: '3.9'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: replate_db
    environment:
      POSTGRES_USER: replate_user
      POSTGRES_PASSWORD: replate_pass
      POSTGRES_DB: replate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - replate_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replate_user -d replate_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: replate_redis
    ports:
      - "6379:6379"
    networks:
      - replate_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: replate_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - replate_net
    volumes:
      - ./backend:/app
      - ./tests:/tests
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: replate_worker
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - replate_net
    volumes:
      - ./backend:/app
    command: celery -A app.worker worker --loglevel=info
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: replate_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - replate_net
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:

networks:
  replate_net:
    driver: bridge
