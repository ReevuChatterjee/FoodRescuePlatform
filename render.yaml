databases:
  - name: replate_db
    databaseName: replate_db
    user: replate_user
    plan: free

services:
  - type: redis
    name: replate_redis
    plan: free
    ipAllowList: [] # only allow internal connections

  - type: web
    name: replate_backend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: replate_db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: replate_redis
          property: connectionString
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        sync: false # Must be set manually in Render Dashboard
      - key: JWT_REFRESH_SECRET
        sync: false # Must be set manually in Render Dashboard
      - key: ALLOWED_ORIGINS
        sync: false # Must be set manually in Render Dashboard (e.g. https://your-frontend.vercel.app)
